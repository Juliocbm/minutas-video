# Entorno de desarrollo (pruebas). El plugin no lo usa: cada script declara sus propias dependencias.
#   uv run pytest
[project]
name = "minutas-video-dev"
version = "0.2.0"
description = "Pruebas de minutas-video"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "av>=12", "numpy", "pillow>=10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# En Windows, faulthandler imprime "access violation" por una excepción que PyAV maneja al cargar sus DLL.
addopts = "-p no:faulthandler"
